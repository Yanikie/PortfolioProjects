; Switch from normal pico setup of platform io to more available pico W platform
[env:rpipicow]
platform  = https://github.com/maxgerhardt/platform-raspberrypi.git
board     = rpipicow
framework = arduino
; To ensure proper wifi capabilities we need a good core
board_build.core = earlephilhower
; To read at the same speed as the esp
monitor_speed = 115200
; mbed resets the Pico into BOOTSEL over USB and finds the RPI-RP2 drive by itself,
; so no button press or drive letter is needed (picotool would need a Zadig driver on Windows)
upload_protocol = mbed


lib_deps =
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor @ ^1.1.14