<!DOCTYPE html>
<style>
@font-face{
    font-family: "IBM Plex Serif";
    src: url("/fonts/ibm-plex-serif-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
}
@font-face{
    font-family: "IBM Plex Serif";
    src: url("/fonts/ibm-plex-serif-latin-500-normal.woff2") format("woff2");
    font-weight: 500;
    font-display: swap;
}
:root{
    --backgroundColor: #1F3A2E;
    --textColor:#CFC7B8;
    --textColorMuted:#c7b89b;
    --borderColor:#356652;
    --middleColor:#2F5B49;
    --sectionColor:#29503F;
    --muted:#8a8070;
    --normalFont:"IBM Plex Serif", Georgia, serif;
}
html, button{
    touch-action: manipulation;
}
body{
    background-color: var(--backgroundColor);
    color:var(--textColor);
    padding: 1rem;
    font-variant-numeric: tabular-nums;
}
.textTitle{
    font-family: var(--normalFont);
    font-size: 3rem;
    font-weight: 500;
    line-height: 1.1;
}
.firstShow{
    max-width: 36rem;
    padding:24px;
    background-color: var(--sectionColor);
    border-radius:5px;

    font-family: var(--normalFont);
    font-size: 1rem;
}
.inputRow{
    display:flex;
    gap:0.75rem;
}

button{
    padding:0.5rem 0.75rem;
    background-color: var(--middleColor);
    border:3px solid var(--middleColor);
    border-radius: 5px;
    font-family: var(--normalFont);
    color:var(--textColorMuted);
    transition:border-color 0.15s;
}
button:hover{border-color: var(--borderColor);}
input{
    padding:0.5rem 0.75rem;
    flex:1;
    border-radius: 5px;
    border:3px solid var(--backgroundColor);
    background-color: var(--backgroundColor);
    color:var(--textColorMuted);
    font-family: var(--normalFont);
    font-size: 16px;
    outline:none;
    transition:border-color 0.15s;
}
input::placeholder{color:var(--textColorMuted)}
input:focus{border-color:var(--borderColor);}
.header{
    font-size: 1.5rem;
    padding-bottom:15px;
}
.startGame{
    margin-top: 20px;
    text-align: center;
    width:100%;
}
.startGame:disabled{
    background-color: var(--backgroundColor);
    border-color: var(--sectionColor);
    color: var(--muted);
}
#playersDiv{
    margin-top: 10px;
}
.name{
    flex:1;
    width:100%;
    margin: 3px;
}

/* Playing */

.scoreRow{
    display:flex;
    align-items:stretch;
    border-bottom:1px solid var(--borderColor);
}
.scoreRow:last-child{
    border-bottom: none;
}
.scoreRow button{
    border:none;
    border-radius:0;
    background:none;
    color:var(--textColor);
    font-size:1.1rem;
    cursor:pointer;
}
.scoreRow button:active{background-color:var(--middleColor);}
.scoreRow button:focus-visible{
    outline:2px solid var(--textColorMuted);
    outline-offset:-2px;
}
.mainPoint{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:1rem;
    min-height:52px;
    padding:0 0.5rem 0 0;
    text-align:left;
}
.playerName{
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
}
.points{
    min-width:1.5em;
    font-size:1.3rem;
    font-weight:500;
    text-align:right;
}
.scoreRow .subPoint{
    display:flex;
    align-items:center;
    gap:5px;
    padding:0 0 0 12px;
    border-left:1px solid var(--borderColor);
}
.pip{
    width:10px;
    height:10px;
    border:1.5px solid var(--muted);
    border-radius:50%;
    box-sizing:border-box;
}
.pip.filled{
    background-color:var(--textColorMuted);
    border-color:var(--textColorMuted);
}
.undo{
    margin-top:16px;
    padding:0.5rem 1rem;
    font-size:1rem;
}
.undo:disabled{
    background-color:var(--backgroundColor);
    border-color:var(--sectionColor);
    color:var(--muted);
}

/* -------- Settings -------- */
.top{
    max-width: 36rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 0.5rem 0 1.5rem;
}
.settings{
    position: relative;
    font-family: var(--normalFont);
}
.settings summary{
    padding: 0.5rem 0;
    list-style: none;
    color: var(--textColorMuted);
    cursor: pointer;
}
.settings summary::-webkit-details-marker{
    display: none;
}
.settingsPanel{
    position: absolute;
    top: 100%;
    right: 0;
    z-index: 1;
    width: min(300px, calc(100vw - 2rem));
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background-color: var(--sectionColor);
    border: 1px solid var(--borderColor);
    border-radius: 5px;
}
.setting{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}
.setting input{
    flex: none;
    width: 4rem;
}
.joinField{
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.joinField input{
    flex: none;
}
.settingsPanel button{
    font-size: 1rem;
}
.settingsPanel .quiet{
    background-color: var(--backgroundColor);
    border-color: var(--backgroundColor);
    color: var(--muted);
}
.settingsPanel .quiet:hover{border-color: var(--muted);}

</style>
<!-- ------------------------------------- HTML-------------------------------------------------------------------------- -->
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content= "Playing a game of Toepen gets a lot easier with this scoreboard"/>
    <link rel="canonical" href="https://hogetoorn.com/Toepen">
    <title>ScoreBoard | Toepen</title>
</head>
<body>
<header class="top">
    <div class="textTitle">Toepen</div>
    <details class="settings" id="settings" style="display: none;">
        <summary>Settings</summary>
        <div class="settingsPanel">
            <label class="setting">
                Secondary points per primary point
                <input type="number" id="maxInput" min="1" max="9" value="3" inputmode="numeric"/>
            </label>
            <div class="joinField">
                <input type="text" placeholder="New player" id="joinInputField"/>
                <button onclick="joinPlayer()">Add</button>
            </div>
            <button class="quiet" onclick="resetGame()">Reset scores</button>
            <button class="quiet" onclick="resetState()">Reset names</button>
        </div>
    </details>
</header>
<div class="firstShow" id="firstShow">
    <section class="header">Players</section>
    <div class="inputRow">
        <input type="text" placeholder="Player name" id="nameInputField"/>
        <button class="buttonAdd" onclick="addPlayer()">Add</button>
    </div>
    <div id="playersDiv" style="display: none;"></div>
    <button class="startGame" onclick="startGame()" disabled id="startGameButton">Start Game</button>
</div>
<div class="firstShow playing" id= "playing" style="display:none;">
    <section class="header">Scores</section>
    <div id="scoreRow"></div>
    <button class="undo" id="undoButton" onclick="undo()" disabled>Undo</button>
</div>
</body>

<script>
// ----------------------------------------- Script ---------------------------------------------------------------
const nameInput = document.getElementById('nameInputField');
let players = [];
nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') addPlayer(); });

function addPlayer(){
    const name = nameInput.value.trim();
    if(!name) return;
    players.push(name);
    nameInput.value='';
    placeNames();
}

function removeName(name){
    // Overwrite current array with a new array
    // Let the array be any name which is not equal to the provided name
    players = players.filter(player => player !== name);
    placeNames();
}

function placeNames(){
    const correspondingDiv = document.getElementById('playersDiv');
    correspondingDiv.innerHTML = players.map(player =>`
    <button class="name" onclick="removeName('${player}')">${player}</button>`).join('');
    correspondingDiv.style.display='grid';
    if(players.length >= 2){document.getElementById('startGameButton').disabled = false;}
    else if(players.length == 0){document.getElementById('playersDiv').style.display = 'none';}
    else if(players.length < 2){document.getElementById('startGameButton').disabled = true;}
}

let scores = {};
let subScores = {};

function startGame(){
    players.forEach(player => scores[player] = 0);
    players.forEach(player => subScores[player] = 0);
    document.getElementById('firstShow').style.display = 'none';
    document.getElementById('playersDiv').style.display = 'none';
    document.getElementById('playing').style.display = 'block';
    settings.style.display = 'block';
    undoStack = [];
    renderScores();
}

function renderScores(){
    document.getElementById('scoreRow').innerHTML = players.map((p, i) => `
        <div class="scoreRow">
            <button class="mainPoint" onclick="addPoint(${i})" aria-label="${p}, ${scores[p]} points. Add a point">
                <span class="playerName">${p}</span>
                <span class="points">${scores[p]}</span>
            </button>
            <button class="subPoint" onclick="addSub(${i})" aria-label="${subScores[p]} of ${subMax} secondary points. Add one">${pips(p)}</button>
        </div>`
    ).join('');
    document.getElementById('undoButton').disabled = undoStack.length === 0;
}

function pips(p){
    return Array.from({length: subMax}, (_, n) => `<span class="pip${n < subScores[p] ? ' filled' : ''}"></span>`).join('');
}

// -------- Join mid-game --------
const joinInput = document.getElementById('joinInputField');
joinInput.addEventListener('keydown', e => { if(e.key === 'Enter') joinPlayer(); });

function joinPlayer(){
    const name = joinInput.value.trim();
    if(!name || players.includes(name)) return;
    snapshot();
    scores[name] = Math.max(...players.map(p => scores[p]));
    subScores[name] = 0;
    players.push(name);
    joinInput.value = '';
    renderScores();
}

// -------- Scoring --------
function addPoint(i){
    snapshot();
    scores[players[i]]++;
    renderScores();
}

// -------- Secondary points --------
let subMax = 3;
const maxInput = document.getElementById('maxInput');
maxInput.addEventListener('change', changeMax);

function addSub(i){
    const name = players[i];
    snapshot();
    subScores[name]++;
    if(subScores[name] >= subMax){
        scores[name]++;
        subScores[name] = 0;
    }
    renderScores();
}

function changeMax(){
    const value = Math.min(9, Math.round(Number(maxInput.value)));
    if(!value || value < 1 || value === subMax){
        maxInput.value = subMax;
        return;
    }
    snapshot();
    subMax = value;
    maxInput.value = subMax;
    players.forEach(p => {
        if(subScores[p] >= subMax){
            scores[p]++;
            subScores[p] = 0;
        }
    });
    renderScores();
}

function resetGame(){
    snapshot();
    players.forEach(player => scores[player] = 0);
    players.forEach(player => subScores[player] = 0);
    renderScores();
}
function resetState(){
    players = [];
    nameInput.value = '';
    document.getElementById('startGameButton').disabled = true;
    document.getElementById('playersDiv').style.display = 'none';
    document.getElementById('playing').style.display = 'none';
    document.getElementById('firstShow').style.display = 'block';
    settings.open = false;
    settings.style.display = 'none';
}

// -------- Undo --------
let undoStack = [];

function snapshot(){
    undoStack.push({players: [...players], scores: {...scores}, subScores: {...subScores}, subMax});
}

function undo(){
    const last = undoStack.pop();
    if(!last) return;
    players = last.players;
    scores = last.scores;
    subScores = last.subScores;
    subMax = last.subMax;
    maxInput.value = subMax;
    renderScores();
}

// -------- Settings --------
const settings = document.getElementById('settings');
document.addEventListener('click', e => {
    if(!settings.open || settings.contains(e.target)) return;
    settings.open = false;
    e.stopPropagation();
}, true);
</script>
